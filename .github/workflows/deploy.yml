name: Deploy to k-popstay.wehome.me

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/k-popstay
            git pull origin main
            echo "✅ Deploy done: $(date '+%Y-%m-%d %H:%M:%S KST')"
