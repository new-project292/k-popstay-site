<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>K-POPSTAY BUSAN 2026 게스트 긴급 지원 요청</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #761183;
  --purple-deep: #5a0d63;
  --purple-mid: #9c27b0;
  --purple-tint: #f9f0fb;
  --purple-soft: #eeddf5;
  --purple-border: #dbb8e3;
  --ink: #1a1023;
  --ink-mid: #4a3555;
  --ink-muted: #8a7995;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  -webkit-font-smoothing: antialiased;
}

.card {
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 4px 40px rgba(0,0,0,0.12);
  max-width: 420px;
  width: 100%;
  overflow: hidden;
}

/* ── Header ── */
.card-header {
  background: var(--purple);
  padding: 28px 28px 26px;
  position: relative;
  overflow: hidden;
}
.card-header::before {
  content: '';
  position: absolute;
  top: -10px; right: -10px;
  width: 140px; height: 140px;
  background: repeating-linear-gradient(
    135deg,
    transparent, transparent 14px,
    rgba(255,255,255,0.12) 14px,
    rgba(255,255,255,0.12) 16px
  );
  border-radius: 50%;
}
.card-header::after {
  content: '';
  position: absolute;
  top: 10px; right: 10px;
  width: 100px; height: 100px;
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 50%;
}
.card-header .logo {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 10px;
  position: relative;
}
.card-header h1 {
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.03em;
  position: relative;
}
.card-header p {
  font-size: 13px;
  font-weight: 400;
  color: rgba(255,255,255,0.7);
  margin-top: 8px;
  font-style: italic;
  position: relative;
}

/* ── Body ── */
.card-body { padding: 28px 28px 32px; }

.desc {
  font-size: 14.5px;
  color: var(--ink-mid);
  line-height: 1.75;
  margin-bottom: 20px;
  word-break: keep-all;
}
.desc strong { color: var(--purple); font-weight: 700; }

/* ── Notice ── */
.notice {
  background: #fdfaf3;
  border: 1.5px solid #e8d89a;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 26px;
  font-size: 13.5px;
  color: #6b5700;
  line-height: 1.65;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.notice-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.notice strong { font-weight: 700; }

/* ── Form ── */
.form-group { margin-bottom: 12px; }
.form-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
  margin-bottom: 8px;
  display: block;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.form-input, .form-textarea {
  width: 100%;
  background: #fff;
  border: 1.5px solid #e0d6e8;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.form-input::placeholder, .form-textarea::placeholder { color: #c0b4cc; }
.form-input:focus, .form-textarea:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(118,17,131,0.09);
}
.form-textarea { min-height: 110px; resize: vertical; }

/* ── Buttons ── */
.btn {
  width: 100%;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  padding: 16px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: -0.01em;
}
.btn-lookup {
  background: var(--purple);
  color: #fff;
  margin-top: 8px;
  box-shadow: 0 4px 20px rgba(118,17,131,0.35);
}
.btn-lookup:hover { background: var(--purple-deep); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(118,17,131,0.45); }
.btn-submit {
  background: var(--purple);
  color: #fff;
  margin-top: 12px;
  box-shadow: 0 4px 20px rgba(118,17,131,0.35);
}
.btn-submit:hover { background: var(--purple-deep); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(118,17,131,0.45); }
.btn:disabled { background: #cdc0d4; box-shadow: none; cursor: not-allowed; transform: none; }

/* ── Guest confirm ── */
.guest-confirm {
  display: none;
  background: var(--purple-tint);
  border: 1.5px solid var(--purple-soft);
  border-left: 4px solid var(--purple);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 12px;
  align-items: center;
  gap: 14px;
}
.guest-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple-mid), var(--purple-deep));
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: #fff;
  box-shadow: 0 2px 8px rgba(118,17,131,0.2);
}
.guest-confirm-info { flex: 1; min-width: 0; }
.guest-confirm-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.guest-confirm-name {
  font-size: 17px;
  font-weight: 800;
  color: var(--purple-deep);
  line-height: 1.2;
}
.guest-confirm-sub {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 3px;
}
.guest-confirm-warn {
  display: none;
  background: #fff5f5;
  border: 1.5px solid #fbd0d0;
  border-radius: 14px;
  padding: 13px 16px;
  margin-bottom: 12px;
  font-size: 13px;
  color: #9f1239;
  line-height: 1.6;
}

/* ── Step 2 ── */
.step2 { display: none; margin-top: 20px; padding-top: 20px; border-top: 1.5px solid #f0e8f5; }

/* ── Recipients ── */
.recipients { display: flex; gap: 10px; margin-bottom: 20px; }
.recipient {
  flex: 1;
  background: #faf7fc;
  border: 1.5px solid #eeddf5;
  border-radius: 14px;
  padding: 12px 14px;
}
.recipient-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--purple);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 5px;
}
.recipient-name { font-size: 13px; font-weight: 700; color: var(--ink); }
.recipient-role { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

/* ── Result ── */
.result-box {
  display: none;
  border-radius: 14px;
  padding: 16px 18px;
  text-align: center;
  margin-top: 14px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.65;
}
.result-box.success { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #166534; }
.result-box.error   { background: #fff5f5; border: 1.5px solid #fecdd3; color: #9f1239; }

/* ── Back link ── */
.back-link {
  display: block;
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  color: var(--ink-muted);
  text-decoration: none;
  transition: color .15s;
}
.back-link:hover { color: var(--purple); }

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin-right: 7px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width:480px){
  .card-body { padding: 22px 20px 28px; }
  .card-header { padding: 24px 20px 22px; }
  .card-header h1 { font-size: 28px; }
  .recipients { flex-direction: column; }
}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo">K-POPSTAY BUSAN 2026</div>
    <h1>게스트 긴급<br>지원 요청</h1>
    <p>Guest Emergency Support Request</p>
  </div>
  <div class="card-body">
    <p class="desc">호스트와 연락이 닿지 않거나 현장에서 <strong>긴급 상황이 발생한 경우</strong>, 위홈 대표 및 부산시 담당자에게 즉시 문자가 발송됩니다.</p>

    <div class="notice">
      <span class="notice-icon">⚠️</span>
      <span>위급 상황이라면 먼저 <strong>119(소방/응급)</strong> 또는 <strong>112(경찰)</strong>에 신고해 주세요.</span>
    </div>

    <!-- Step 1 -->
    <div id="step1">
      <div class="form-group">
        <label class="form-label" for="guestEmail">게스트 이메일</label>
        <input class="form-input" id="guestEmail" type="email" placeholder="신청 시 사용한 이메일" inputmode="email" autocomplete="email">
      </div>
      <div class="guest-confirm" id="guestConfirm">
        <div class="guest-avatar" id="guestAvatar">?</div>
        <div class="guest-confirm-info">
          <div class="guest-confirm-label">등록된 게스트 정보</div>
          <div class="guest-confirm-name" id="confirmedName"></div>
          <div class="guest-confirm-sub" id="confirmedSub"></div>
        </div>
      </div>
      <div class="guest-confirm-warn" id="guestWarn"></div>
      <button type="button" class="btn btn-lookup" id="btnLookup">본인 확인</button>
    </div>

    <!-- Step 2 -->
    <div class="step2" id="step2">
      <div class="recipients">
        <div class="recipient">
          <div class="recipient-label">수신 1</div>
          <div class="recipient-name">조산구 대표</div>
          <div class="recipient-role">위홈</div>
        </div>
        <div class="recipient">
          <div class="recipient-label">수신 2</div>
          <div class="recipient-name">부산시 담당자</div>
          <div class="recipient-role">부산시 (임시)</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="situation">긴급 상황 내용 *</label>
        <textarea class="form-textarea" id="situation" placeholder="발생한 상황을 간략히 설명해 주세요." required></textarea>
      </div>
      <button type="button" class="btn btn-submit" id="submitBtn">긴급 지원 요청 전송</button>
    </div>

    <div class="result-box" id="resultBox"></div>

    <a href="https://k-popstay.wehome.me/" class="back-link">← K-POPSTAY 메인으로 돌아가기</a>
  </div>
</div>

<script>
var confirmedGuestName = '';
var confirmedGuestEmail = '';
var confirmedGuestPhone = '';

var emailInput = document.getElementById('guestEmail');
var lookupTimer = null;

emailInput.addEventListener('input', function() {
  clearTimeout(lookupTimer);
  var val = this.value.trim();
  if (val.includes('@') && val.includes('.')) {
    lookupTimer = setTimeout(doLookup, 800);
  } else {
    resetConfirm();
  }
});

document.getElementById('btnLookup').addEventListener('click', doLookup);

emailInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); doLookup(); }
});

async function doLookup() {
  var email = document.getElementById('guestEmail').value.trim();
  if (!email) { return; }
  var btn = document.getElementById('btnLookup');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>확인 중...';
  resetConfirm();

  try {
    var res = await fetch('/guest-emergency.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'lookup', email: email})
    });
    var json = await res.json();
    if (json.ok && json.guest) {
      confirmedGuestName  = json.guest.name;
      confirmedGuestEmail = json.guest.email;
      confirmedGuestPhone = json.guest.phone || '';
      document.getElementById('confirmedName').textContent = json.guest.name;
      document.getElementById('confirmedSub').textContent  = json.guest.nationality || '';
      var initial = json.guest.name ? json.guest.name.charAt(0) : '?';
      document.getElementById('guestAvatar').textContent = initial;
      document.getElementById('guestConfirm').style.display = 'flex';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('situation').focus();
    } else {
      document.getElementById('guestWarn').style.display = 'block';
      document.getElementById('guestWarn').innerHTML =
        json.msg || '등록된 게스트 정보를 찾을 수 없습니다.<br>신청 시 사용한 이메일을 확인해 주세요.';
      document.getElementById('step2').style.display = 'none';
    }
  } catch(e) {
    document.getElementById('guestWarn').style.display = 'block';
    document.getElementById('guestWarn').textContent = '조회 중 오류가 발생했습니다. 다시 시도해 주세요.';
  }
  btn.disabled = false;
  btn.textContent = '본인 확인';
}

function resetConfirm() {
  document.getElementById('guestConfirm').style.display = 'none';
  document.getElementById('guestWarn').style.display = 'none';
  document.getElementById('step2').style.display = 'none';
  confirmedGuestName = '';
  confirmedGuestEmail = '';
  confirmedGuestPhone = '';
}

document.getElementById('submitBtn').addEventListener('click', async function() {
  var situation = document.getElementById('situation').value.trim();
  if (!situation) { document.getElementById('situation').focus(); return; }

  var btn = this;
  var resultBox = document.getElementById('resultBox');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>전송 중...';
  resultBox.style.display = 'none';

  try {
    var res = await fetch('/guest-emergency.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        action:      'send',
        guestName:   confirmedGuestName,
        guestEmail:  confirmedGuestEmail,
        guestPhone:  confirmedGuestPhone,
        situation:   situation,
      })
    });
    var json = await res.json();
    if (json.ok) {
      resultBox.className = 'result-box success';
      resultBox.innerHTML = '요청이 전송되었습니다.<br>위홈 대표 및 부산시 담당자에게 즉시 문자가 발송됩니다.';
      resultBox.style.display = 'block';
      document.getElementById('situation').value = '';
      window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    } else {
      throw new Error(json.msg || '전송 실패');
    }
  } catch(err) {
    resultBox.className = 'result-box error';
    resultBox.innerHTML = '전송 중 오류가 발생했습니다.<br>위홈 고객센터(1544-5665)로 직접 연락해 주세요.';
    resultBox.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '긴급 지원 요청 전송';
});
</script>
</body>
</html>
